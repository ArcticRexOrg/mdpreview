<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link id="theme-link" rel="stylesheet" href="github-markdown.min.css" data-pagedjs-ignore>
    <link id="code-theme-link" rel="stylesheet" href="highlight-github.min.css" data-pagedjs-ignore>
    <style data-pagedjs-ignore>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 24px 32px; }
        #content img { display: block !important; margin-left: auto !important; margin-right: auto !important; width: auto !important; max-width: 100% !important; }
        #content {
            max-width: 900px;
            margin: 0 auto;
        }
        /* In document mode, let Paged.js control width */
        .pagedjs_page_content #content {
            max-width: none;
            margin: 0;
        }

        /* Table overrides — applied on top of every theme */
        #content table {
            border-collapse: collapse;
            width: 100%;
            margin: 1.25em 0;
            font-size: 0.95em;
        }
        #content th,
        #content td {
            border: 1px solid #d0d7de;
            padding: 8px 14px;
            text-align: left;
            vertical-align: top;
            line-height: 1.5;
        }
        #content th {
            font-weight: 600;
            background-color: #f6f8fa;
            white-space: nowrap;
        }
        #content tr:nth-child(even) td {
            background-color: #fafbfc;
        }
        #content tr:hover td {
            background-color: #f0f3f6;
        }

        @media (prefers-color-scheme: dark) {
            html:not([data-theme=light]) #content th,
            html:not([data-theme=light]) #content td {
                border-color: #30363d;
            }
            html:not([data-theme=light]) #content th {
                background-color: #21262d;
            }
            html:not([data-theme=light]) #content tr:nth-child(even) td {
                background-color: #161b22;
            }
            html:not([data-theme=light]) #content tr:hover td {
                background-color: #1c2128;
            }
        }

        /* Document mode: page edge styling */
        .pagedjs_page {
            box-shadow: 0 1px 6px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.06);
            margin-bottom: 20px;
            background: white;
        }
        .pagedjs_pages {
            padding: 20px 0;
        }
        /* Style margin box text */
        .pagedjs_margin-content {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 9pt;
            color: #666;
        }
        /* Header bottom border */
        .pagedjs_margin-top-left,
        .pagedjs_margin-top-center,
        .pagedjs_margin-top-right {
            border-bottom: 0.5px solid #ddd;
            padding-bottom: 4px;
        }
        /* Footer top border */
        .pagedjs_margin-bottom-left,
        .pagedjs_margin-bottom-center,
        .pagedjs_margin-bottom-right {
            border-top: 0.5px solid #ddd;
            padding-top: 4px;
        }
        /* Logo in header margin box */
        .pagedjs_margin-content img {
            max-height: 20px;
            vertical-align: middle;
        }

        /* Hide body during pagination transitions — applied via class to avoid flash */
        body.paginating {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Mermaid diagram containers: center, constrain, keep together across page breaks */
        .mermaid-diagram {
            display: flex;
            justify-content: center;
            margin: 1.25em 0;
            break-inside: avoid;
        }
        .mermaid-diagram svg {
            max-width: 100%;
            height: auto;
        }
        .mermaid-error {
            border: 1px solid #d0606e;
            background: #fff5f5;
            color: #8a1a1a;
            padding: 10px 14px;
            border-radius: 4px;
            margin: 1.25em 0;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.85em;
            white-space: pre-wrap;
        }

        /* YAML frontmatter: visible metadata, distinct from document prose. */
        #content .frontmatter {
            margin: 0 0 1.5em;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            background: #f6f8fa;
            color: #57606a;
            overflow: hidden;
            break-inside: avoid;
        }
        #content .frontmatter-label {
            padding: 7px 12px;
            border-bottom: 1px solid #d8dee4;
            color: #656d76;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            line-height: 1.3;
            text-transform: uppercase;
        }
        #content .frontmatter pre {
            margin: 0 !important;
            padding: 11px 12px !important;
            border: 0 !important;
            border-radius: 0 !important;
            background: transparent !important;
            color: inherit !important;
            font-size: 0.82em !important;
            line-height: 1.45 !important;
            white-space: pre-wrap !important;
            overflow-wrap: anywhere;
        }
        #content .frontmatter code {
            padding: 0 !important;
            border: 0 !important;
            background: transparent !important;
            color: inherit !important;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: inherit !important;
            white-space: inherit;
        }

        /* Editing: keep the per-block wrappers transparent to layout. */
        #content .seg { outline: none; }
        #content .seg[contenteditable="true"]:focus { outline: none; }

        /* Links in editable blocks take the caret on plain click and open on
           Cmd+click; while Cmd is held, show the pointer so the link reads as
           clickable. (Non-editable contexts keep the pointer full-time.) */
        body.meta-held [contenteditable="true"] a { cursor: pointer; }

        /* Heading-level badge in the left gutter: font size alone can't tell
           H3 from H5 at a glance, and the Shift+Cmd+H/G ladder needs visible
           feedback. Editing view only (.seg exists only there) — pseudo
           content never enters textContent, so the reconciler never sees it,
           and document/PDF mode renders without it. Inherits the heading's
           color so every theme keeps its own contrast. */
        /* Reserve a real gutter: themes with little body padding otherwise
           clip the badges at the pane edge (they sit outside the heading
           box). Editing view only — #content does not exist in paged mode. */
        #content { padding-left: 3.1em; }
        #content .seg h1, #content .seg h2, #content .seg h3,
        #content .seg h4, #content .seg h5, #content .seg h6 { position: relative; }
        #content .seg h1::before, #content .seg h2::before, #content .seg h3::before,
        #content .seg h4::before, #content .seg h5::before, #content .seg h6::before {
            position: absolute;
            right: 100%;
            margin-right: 0.75em;
            top: 50%;
            transform: translateY(-50%);
            font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
            letter-spacing: 0.02em;
            color: inherit;
            opacity: 0.45;
            pointer-events: none;
        }
        #content .seg h1::before { content: "H1"; }
        #content .seg h2::before { content: "H2"; }
        #content .seg h3::before { content: "H3"; }
        #content .seg h4::before { content: "H4"; }
        #content .seg h5::before { content: "H5"; }
        #content .seg h6::before { content: "H6"; }

        /* A block demoted to read-only (its display↔source map can't be
           trusted) is indistinguishable from an editable one until a click
           goes dead. Reveal it on hover: a faint dashed outline plus a small
           label, greys only so both themes work. */
        #content .seg-readonly:hover {
            outline: 1px dashed rgba(127, 127, 127, 0.5);
            outline-offset: 4px;
            cursor: default;
            position: relative;
        }
        #content .seg-readonly:hover::after {
            content: 'read-only';
            position: absolute;
            top: -1.4em;
            right: 0;
            font-size: 11px;
            line-height: 1;
            padding: 2px 6px;
            border-radius: 3px;
            color: rgba(127, 127, 127, 0.9);
            background: rgba(127, 127, 127, 0.12);
            pointer-events: none;
        }

        /* Cross-block (copy-only) selection: the macOS inactive-selection
           grey signals "selected, but not live for typing" — in-block
           selections keep the native editing blue. */
        #content.cross-select ::selection { background: rgba(127, 127, 127, 0.35); color: inherit; }

        /* Blocking conflict overlay */
        .conflict-panel {
            border: 1px solid #d9a441;
            background: #fffbf0;
            border-radius: 6px;
            margin: 0.75em 0;
            padding: 10px 12px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 13px;
        }
        .conflict-title { font-weight: 600; color: #8a5a00; margin-bottom: 8px; }
        .conflict-cols { display: flex; gap: 10px; }
        .conflict-col { flex: 1; min-width: 0; }
        .conflict-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: #777; margin-bottom: 4px; }
        .conflict-panel pre {
            margin: 0; padding: 8px; background: #fff; border: 1px solid #e3e3e3; border-radius: 4px;
            white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
        }
        .conflict-disk { border-color: #bcd6bc !important; }
        .conflict-actions { margin-top: 8px; display: flex; gap: 8px; }
        .conflict-actions button {
            font-size: 12px; padding: 4px 12px; border-radius: 5px; border: 1px solid #c5c5c5;
            background: #f5f5f5; cursor: pointer;
        }
        .conflict-actions button[data-act="mine"] { background: #2f6fdb; border-color: #2f6fdb; color: #fff; }

        @media (prefers-color-scheme: dark) {
            html:not([data-theme=light]) #content .frontmatter {
                border-color: #30363d;
                background: #161b22;
                color: #9da7b3;
            }
            html:not([data-theme=light]) #content .frontmatter-label {
                border-color: #30363d;
                color: #8c959f;
            }
        }
    </style>
    <script src="marked.min.js"></script>
    <script src="highlight.min.js"></script>
    <script src="mermaid.min.js"></script>
    <script>window.PagedConfig = { auto: false };</script>
    <script src="paged.polyfill.js"></script>
    <script src="editor-core.js"></script>
    <script>
        marked.use({ gfm: true, breaks: false });

        // Pre-process markdown to convert ![alt](url =WIDTHx) to inline HTML
        function preprocessImages(md) {
            return md.replace(/!\[([^\]]*)\]\((\S+)\s+=(\d+%?)x(\d+%?)?\)/g, function(match, alt, src, w, h) {
                var attrs = 'src="' + src + '" alt="' + alt.replace(/"/g, '&quot;') + '" width="' + w + '"';
                if (h) attrs += ' height="' + h + '"';
                return '<div><img ' + attrs + '></div>\n';
            });
        }

        function escapeHTML(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function renderFrontmatter(raw) {
            var parsed = EditorCore.leadingFrontmatter(raw);
            var yaml = parsed ? parsed.content.replace(/\r?\n$/, '') : raw;
            return '<aside class="frontmatter" aria-label="Frontmatter">' +
                '<div class="frontmatter-label">Frontmatter</div>' +
                '<pre><code class="language-yaml">' + escapeHTML(yaml) + '</code></pre>' +
                '</aside>';
        }

        function renderSegment(seg) {
            if (seg.type === 'frontmatter') return renderFrontmatter(seg.raw);
            return marked.parse(preprocessImages(seg.raw));
        }

        function renderDocumentMarkdown(md) {
            var parsed = EditorCore.leadingFrontmatter(md);
            if (!parsed) return marked.parse(preprocessImages(md));
            return renderFrontmatter(parsed.raw) + marked.parse(preprocessImages(parsed.rest));
        }

        var _rawMarkdown = '';
        var _currentMode = 'reading';
        var _currentConfig = null;
        var _paginationGen = 0;
        var _debounceTimer = null;
        var _baseURL = '';
        var _mermaidCounter = 0;

        // --- In-place editing state ---
        var _segments = [];          // EditorCore.segment() output; raw join === file
        var _baseMarkdown = '';      // last version common to disk + view (for 3-way merge)
        var _pendingSaveBase = null; // base before the last posted save, until Swift confirms the write landed
        var _saveTimer = null;       // debounce for autosave
        var _dirty = false;          // user edits since the last disk sync — the ONLY licence to write the file
        var _conflicts = [];         // open blocking conflicts (suspends autosave)
        var _undoStack = [];         // our own undo (native undo bypasses source mutations); entries are { md, caret }
        var _redoStack = [];
        var _lastUndoTime = 0;       // for coalescing a burst of typing into one undo step
        var UNDO_COALESCE_MS = 800;
        var _listenersBound = false;
        // A caret parked in an empty editable slot with no text node (a new
        // empty <li>): { segIndex, srcOffset }. Typing is intercepted and folded
        // into the source at srcOffset, since the DOM has nowhere to read it.
        var _pendingEmpty = null;
        // Cross-block copy-only selection: while a selection spans more than
        // one block, every block is parked contenteditable=false so the
        // selection is an ordinary page selection (paintable, Cmd+C-able);
        // editing it is refused. _drag tracks a potential cross-block mouse
        // drag from mousedown: { x, y, anchorDiv, anchorNode, anchorOffset }.
        var _crossMode = false;
        var _drag = null;

        function mermaidTheme() {
            // Force default theme in document/PDF mode (matches force-light behavior);
            // otherwise follow OS appearance.
            if (_currentMode === 'document') return 'default';
            return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark' : 'default';
        }

        async function processMermaid(container) {
            var blocks = container.querySelectorAll('pre > code.language-mermaid');
            if (!blocks.length) return;
            mermaid.initialize({ startOnLoad: false, securityLevel: 'loose', theme: mermaidTheme() });
            for (var i = 0; i < blocks.length; i++) {
                var code = blocks[i];
                var pre = code.parentElement;
                var src = code.textContent;
                var id = 'mermaid-' + (++_mermaidCounter);
                var wrap = document.createElement('div');
                wrap.className = 'mermaid-diagram';
                var ok = false;
                try {
                    // parse() with suppressErrors returns false on syntax errors
                    // instead of throwing *and* injecting a debug SVG into the DOM.
                    ok = !!(await mermaid.parse(src, { suppressErrors: true }));
                } catch (_) { ok = false; }
                if (ok) {
                    try {
                        var result = await mermaid.render(id, src);
                        wrap.innerHTML = result.svg;
                        if (result.bindFunctions) result.bindFunctions(wrap);
                    } catch (e) {
                        ok = false;
                    }
                }
                if (!ok) {
                    wrap.className = 'mermaid-error';
                    wrap.textContent = 'Mermaid syntax error in block:\n\n' + src.trim();
                }
                pre.parentNode.replaceChild(wrap, pre);
            }
            // Mermaid can leave behind orphan containers from failed renders.
            document.querySelectorAll('body > div[id^="dmermaid-"], body > iframe[id^="mermaid-"]').forEach(function(el){ el.remove(); });
        }

        function setBaseURL(url) {
            _baseURL = url;
        }

        // Resolve relative image/link paths against the markdown file's directory
        function resolveRelativePaths(container) {
            if (!_baseURL) return;
            container.querySelectorAll('img').forEach(function(img) {
                var src = img.getAttribute('src');
                if (src && !src.match(/^(https?:|data:|file:\/)/)) {
                    img.src = _baseURL + src;
                }
            });
            container.querySelectorAll('a').forEach(function(a) {
                var href = a.getAttribute('href');
                if (href && !href.match(/^(https?:|data:|file:\/|#|mailto:)/)) {
                    a.href = _baseURL + href;
                }
            });
        }

        function renderMarkdown(md) {
            elog('load ' + md.length + ' bytes');
            // A full (re)load from Swift establishes a new common base for merges.
            _rawMarkdown = md;
            _baseMarkdown = md;
            _dirty = false;
            _conflicts = [];
            if (_currentMode === 'reading') {
                renderReading();
            } else {
                debouncePaginate();
            }
        }

        // keepSegments: render the in-memory _segments as-is (used when they
        // carry a transient empty-paragraph block that isn't in _rawMarkdown).
        // Otherwise re-segment from _rawMarkdown.
        async function renderReading(keepSegments) {
            var content = document.getElementById('content');
            if (!content) {
                // Rebuild content div if Paged.js destroyed it
                content = document.createElement('div');
                content.id = 'content';
                document.body.appendChild(content);
            }
            var scrollTop = window.scrollY;
            // A rebuild replaces every block with fresh attributes — any
            // cross-block copy-only selection is gone with the old DOM.
            _crossMode = false; _drag = null;
            content.classList.remove('cross-select');
            // Segmented render: one editable <div data-seg> per top-level block,
            // so edits can be folded back into just that block's source. `space`
            // separators stay in _segments (for reassembly) but aren't rendered.
            if (!keepSegments) _segments = EditorCore.segment(_rawMarkdown, marked, document);
            content.className = isGithubTheme() ? 'markdown-body' : '';
            content.innerHTML = '';
            var editing = (_currentMode === 'reading' && _conflicts.length === 0);
            _segments.forEach(function(seg, i) {
                if (seg.type === 'space') return;
                var div = document.createElement('div');
                div.className = 'seg';
                div.setAttribute('data-seg', String(i));
                if (seg.transient) {
                    // Empty editable paragraph: a caret target with no source bytes.
                    div.setAttribute('contenteditable', 'true');
                    div.innerHTML = '<p><br></p>';
                    content.appendChild(div);
                    return;
                }
                div.setAttribute('contenteditable', (editing && seg.editable) ? 'true' : 'false');
                // A text-like block that WOULD be editable but was demoted —
                // its display↔source map couldn't be trusted — looks identical
                // to an editable one, so a dead click reads as a broken editor.
                // Mark it so hover explains itself; inherently read-only blocks
                // (code, mermaid, hr) stay unadorned.
                if (editing && !seg.editable && seg.token && EditorCore.isEditableBlock(seg.token)) {
                    div.classList.add('seg-readonly');
                    div.setAttribute('title', 'Read-only: this block’s markdown can’t be safely edited in place');
                }
                div.innerHTML = renderSegment(seg);
                EditorCore.stripStructuralWhitespace(div);
                content.appendChild(div);
            });
            resolveRelativePaths(content);
            content.querySelectorAll('pre code:not(.language-mermaid)').forEach(function(block) {
                hljs.highlightElement(block);
            });
            window.scrollTo(0, scrollTop);
            await processMermaid(content);
            bindEditingListeners(content);
            if (_conflicts.length) renderConflicts(content);
        }

        function debouncePaginate() {
            clearTimeout(_debounceTimer);
            _debounceTimer = setTimeout(function() {
                paginate();
            }, 300);
        }

        async function paginate() {
            var gen = ++_paginationGen;
            // Hide during transition (class may already be set by setViewMode)
            document.body.classList.add('paginating');
            // Force light mode for document/PDF view
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.setAttribute('data-theme', 'light');
            document.body.style.background = '#f0f0f0';
            // Clean up previous Paged.js output
            removePagedDOM();
            // Ensure content div exists
            var el = document.getElementById('content');
            if (!el) {
                el = document.createElement('div');
                el.id = 'content';
                document.body.appendChild(el);
            }
            // Render markdown into content (hidden)
            el.innerHTML = renderDocumentMarkdown(_rawMarkdown);
            el.className = isGithubTheme() ? 'markdown-body' : '';
            resolveRelativePaths(el);
            document.querySelectorAll('#content pre code:not(.language-mermaid)').forEach(function(block) {
                hljs.highlightElement(block);
            });
            await processMermaid(el);
            if (gen !== _paginationGen) return; // stale
            // Build @page CSS from config
            var pagedCSS = buildPagedCSS(_currentConfig);
            // Wrap content so theme CSS selectors still match inside Paged.js pages
            var wrapperClass = isGithubTheme() ? 'markdown-body' : '';
            var logoHTML = '';
            if (_currentConfig && _currentConfig.logoBase64) {
                logoHTML = '<div id="running-logo"><img src="' + _currentConfig.logoBase64 + '"></div>';
            }
            var wrappedHTML = logoHTML + '<div id="content" class="' + wrapperClass + '">' + el.innerHTML + '</div>';
            // Build stylesheet array for Paged.js
            var stylesheets = [];
            if (pagedCSS) {
                var obj = {};
                obj[window.location.href] = pagedCSS;
                stylesheets.push(obj);
            }
            // Run Paged.js
            try {
                var paged = new Paged.Previewer();
                var flow = await paged.preview(
                    wrappedHTML,
                    stylesheets,
                    document.body
                );
                if (gen !== _paginationGen) return; // stale
                // Remove the original content div (Paged.js creates its own)
                if (el.parentNode) el.parentNode.removeChild(el);
            } catch(e) {
                console.error('Paged.js error:', e);
            }
            // Reveal once pagination is complete
            document.body.classList.remove('paginating');
            // Notify Swift to fade in the native webview
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.paginationDone) {
                window.webkit.messageHandlers.paginationDone.postMessage('done');
            }
        }

        function buildPagedCSS(config) {
            if (!config) return '';

            var m = config.margins || { top: 25, right: 20, bottom: 25, left: 20 };
            var size = config.pageSize || 'A4';

            var css = '@page {\n';
            css += '  size: ' + size + ';\n';
            css += '  margin: ' + m.top + 'mm ' + m.right + 'mm ' + m.bottom + 'mm ' + m.left + 'mm;\n';

            // Logo in top-left via running element
            if (config.logoBase64) {
                css += '  @top-left { content: element(logo); }\n';
                css += '}\n';
                css += '#running-logo { position: running(logo); }\n';
                css += '#running-logo img { max-height: 20px; }\n';
                css += '@page {\n';
            } else if (config.header && config.header.left) {
                css += '  @top-left { content: ' + buildContentValue(config.header.left) + '; }\n';
            }

            // Header remaining positions
            if (config.header) {
                if (config.header.center) css += '  @top-center { content: ' + buildContentValue(config.header.center) + '; }\n';
                if (config.header.right)  css += '  @top-right { content: '  + buildContentValue(config.header.right) + '; }\n';
            }

            // Footer margin boxes
            if (config.companyLine) {
                // Company notepaper: company details centered, page numbers right
                css += '  @bottom-center { content: ' + buildContentValue(config.companyLine) + '; font-size: 7pt; color: #999; }\n';
                if (config.footer) {
                    if (config.footer.left)  css += '  @bottom-left { content: '  + buildContentValue(config.footer.left) + '; }\n';
                    var pageContent = config.footer.center || config.footer.right;
                    if (pageContent) css += '  @bottom-right { content: ' + buildContentValue(pageContent) + '; }\n';
                }
            } else if (config.footer) {
                if (config.footer.left)   css += '  @bottom-left { content: '   + buildContentValue(config.footer.left) + '; }\n';
                if (config.footer.center) css += '  @bottom-center { content: ' + buildContentValue(config.footer.center) + '; }\n';
                if (config.footer.right)  css += '  @bottom-right { content: '  + buildContentValue(config.footer.right) + '; }\n';
            }

            css += '}\n';

            // Page break rules
            css += 'h1, h2, h3 { break-after: avoid; }\n';
            css += 'pre, blockquote, figure, table { break-inside: avoid; }\n';
            css += 'img { break-inside: avoid; display: block; margin-left: auto; margin-right: auto; }\n';
            css += 'p { widows: 3; orphans: 3; }\n';

            return css;
        }

        function buildContentValue(str) {
            // Split on {{page}} and {{pages}} and build CSS content value
            // e.g. "Page {{page}} of {{pages}}" → "Page " counter(page) " of " counter(pages)
